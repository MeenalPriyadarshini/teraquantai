server:
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30m

spring:
  application:
    name: teraquantai-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/teraquantai}
    username: ${DATABASE_USERNAME:tq_user}
    password: ${DATABASE_PASSWORD:change_me_locally}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@terraquantai.local}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  security:
    token-expiry-minutes: 30

logging:
  level:
    com.teraquantai: INFO
