server:
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30m

spring:
  application:
    name: teraquantai-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/teraquantai}
    username: ${DATABASE_USERNAME:tq_user}
    password: ${DATABASE_PASSWORD:change_me_locally}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:no-reply@terraquantai.local}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
  storage:
    local-root: ${FILE_STORAGE_PATH:../.private-storage}
    max-file-size-bytes: 52428800
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  security:
    token-expiry-minutes: 30

logging:
  level:
    com.teraquantai: INFO
